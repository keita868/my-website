<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ダッシュボード | 九州工業大学交響楽団</title>
  <link rel="stylesheet" href="/admin/assets/dashboard.css">
  <script src="/admin/assets/dashboard.js" defer></script>
</head>
<body class="dashboard-page">
  <aside class="sidebar">
    <a class="sidebar-brand" href="/admin" aria-label="ダッシュボード">
      <span class="brand-mark">K</span>
      <span>ORCHESTRA<span class="brand-subtitle">CONTENT MANAGER</span></span>
    </a>
    <nav aria-label="管理メニュー">
      <a class="nav-link active" href="/admin" aria-current="page"><span aria-hidden="true">⌂</span> ダッシュボード</a>
      <a class="nav-link" id="admins-nav" href="/admin/admins" hidden><span aria-hidden="true">♙</span> 管理者管理</a>
      <a class="nav-link" href="/admin/account"><span aria-hidden="true">⚙</span> アカウント設定</a>
    </nav>
  </aside>
  <main class="dashboard-main">
    <header class="topbar">
      <span class="eyebrow">ADMINISTRATION</span>
      <div class="account">
        <span id="admin-email" class="account-email"></span>
        <button id="logout-button" class="text-button" type="button">ログアウト</button>
      </div>
    </header>
    <section class="welcome">
      <p class="eyebrow">OVERVIEW</p>
      <h1>ダッシュボード</h1>
      <p>九州工業大学交響楽団 Webサイトの管理画面です。</p>
    </section>
    <section class="notice-card" aria-labelledby="setup-title">
      <span class="notice-icon" aria-hidden="true">✦</span>
      <div>
        <h2 id="setup-title">管理画面の準備ができました</h2>
        <p>ここに固定ページや記事の管理機能を追加していきます。</p>
      </div>
    </section>
    <p class="form-error" id="dashboard-error" role="alert" aria-live="polite"></p>
  </main>
</body>
</html>
