<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>アカウント設定 | 九州工業大学交響楽団</title>
  <link rel="stylesheet" href="/admin/assets/dashboard.css">
  <script src="/admin/assets/account.js" defer></script>
</head>
<body class="dashboard-page">
  <aside class="sidebar">
    <a class="sidebar-brand" href="/admin" aria-label="ダッシュボード">
      <span class="brand-mark">K</span>
      <span>ORCHESTRA<span class="brand-subtitle">CONTENT MANAGER</span></span>
    </a>
    <nav aria-label="管理メニュー">
      <a class="nav-link" href="/admin"><span aria-hidden="true">⌂</span> ダッシュボード</a>
      <a class="nav-link" href="/admin/updates"><span aria-hidden="true">▤</span> 更新情報管理</a>
      <a class="nav-link" id="admins-nav" href="/admin/admins" hidden><span aria-hidden="true">♙</span> 管理者管理</a>
      <a class="nav-link active" href="/admin/account" aria-current="page"><span aria-hidden="true">⚙</span> アカウント設定</a>
    </nav>
  </aside>
  <main class="dashboard-main">
    <header class="topbar">
      <span class="eyebrow">ACCOUNT</span>
      <div class="account">
        <span id="admin-email" class="account-email"></span>
        <button id="logout-button" class="text-button" type="button">ログアウト</button>
      </div>
    </header>
    <section class="welcome">
      <p class="eyebrow">PROFILE & SECURITY</p>
      <h1>アカウント設定</h1>
      <p>プロフィールとログインパスワードを変更できます。</p>
    </section>
    <section class="panel account-panel" aria-labelledby="profile-title">
      <h2 id="profile-title">プロフィール</h2>
      <form id="profile-form" class="account-form">
        <label>表示名<input name="displayName" required maxlength="80"></label>
        <label>メールアドレス<input name="email" type="email" required maxlength="254"></label>
        <button class="primary-button" type="submit">プロフィールを保存</button>
      </form>
      <p class="form-error" id="profile-message" role="status" aria-live="polite"></p>
    </section>
    <section class="panel account-panel" aria-labelledby="password-title">
      <h2 id="password-title">パスワード変更</h2>
      <form id="password-form" class="account-form">
        <label>現在のパスワード<input name="currentPassword" type="password" required autocomplete="current-password"></label>
        <label>新しいパスワード（12文字以上）<input name="newPassword" type="password" required minlength="12" autocomplete="new-password"></label>
        <button class="primary-button" type="submit">パスワードを変更</button>
      </form>
      <p class="form-error" id="password-message" role="status" aria-live="polite"></p>
      <p class="help-text">変更後は、すべての端末からログアウトされます。新しいパスワードで再ログインしてください。</p>
    </section>
  </main>
</body>
</html>
