<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>管理者ログイン | 九州工業大学交響楽団</title>
  <link rel="stylesheet" href="/admin/assets/dashboard.css">
  <script type="module" src="/admin/assets/login.js"></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <span class="brand-mark" aria-hidden="true">K</span>
    <p class="eyebrow">KYUTECH ORCHESTRA</p>
    <h1>管理者ログイン</h1>
    <p class="intro">管理画面にアクセスするにはログインしてください。</p>
    <form id="login-form">
      <label for="email">メールアドレス</label>
      <input id="email" name="email" type="email" autocomplete="username" required maxlength="254">
      <label for="password">パスワード</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="form-error" id="form-error" role="alert" aria-live="polite"></p>
      <button class="primary-button" type="submit">ログイン</button>
    </form>
  </main>
</body>
</html>
