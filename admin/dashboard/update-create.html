<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>新規投稿 | 九州工業大学交響楽団</title>
  <link rel="stylesheet" href="/admin/assets/dashboard.css">
  <script src="/admin/assets/ui.js" defer></script>
  <script src="/admin/assets/update-create.js" defer></script>
</head>
<body class="dashboard-page">
  <aside class="sidebar">
    <a class="sidebar-brand" href="/admin" aria-label="ダッシュボード">
      <span class="brand-mark">K</span>
      <span>ORCHESTRA<span class="brand-subtitle">CONTENT MANAGER</span></span>
    </a>
    <nav aria-label="管理メニュー">
      <a class="nav-link" href="/admin"><span aria-hidden="true">⌂</span> ダッシュボード</a>
      <a class="nav-link active" href="/admin/updates" aria-current="page"><span aria-hidden="true">▤</span> 更新情報管理</a>
      <a class="nav-link" id="admins-nav" href="/admin/admins" hidden><span aria-hidden="true">♙</span> 管理者管理</a>
      <a class="nav-link" href="/admin/account"><span aria-hidden="true">⚙</span> アカウント設定</a>
    </nav>
  </aside>
  <main class="dashboard-main">
    <header class="topbar">
      <span class="eyebrow">CONTENT MANAGEMENT</span>
      <div class="account">
        <span id="admin-email" class="account-email"></span>
        <button id="logout-button" class="text-button" type="button">ログアウト</button>
      </div>
    </header>
    <section class="welcome">
      <p class="eyebrow">NEWS & NOTICES</p>
      <h1 id="page-title">新規投稿</h1>
      <p id="page-description">投稿種別、タイトル、本文を入力し、下書き保存、予約公開または公開を行います。</p>
    </section>
    <section class="panel" aria-label="新規投稿フォーム">
      <form class="update-form" id="update-form">
        <label>投稿種別
          <select name="type" required>
            <option value="news">ニュース</option>
            <option value="notice">お知らせ</option>
          </select>
        </label>
        <label>タイトル
          <input name="title" type="text" required maxlength="200" autocomplete="off">
        </label>
        <label>本文
          <textarea name="body" required maxlength="5000" rows="10"></textarea>
        </label>
        <label id="schedule-field">予約日時（日本時間）
          <input name="scheduledAt" type="datetime-local">
          <span class="help-text">新規投稿では日時を指定して「予約する」を押してください。編集中の下書きは、空欄で保存すると予約を解除できます。</span>
        </label>
        <div class="attachment-field">
          <label for="attachments">画像・添付ファイル</label>
          <input id="attachments" type="file" accept="image/jpeg,image/png,image/webp,image/gif,application/pdf" multiple>
          <p class="help-text">JPEG、PNG、WebP、GIF、PDF。1ファイル5MiBまで、1投稿あたり合計5件まで。</p>
          <div class="attachment-list" id="attachment-list"></div>
          <p class="help-text">今回追加するファイル</p>
          <div class="attachment-list" id="selected-attachments" aria-live="polite"></div>
        </div>
        <p class="form-error" id="update-error" role="alert" aria-live="assertive"></p>
        <div class="update-actions">
          <a class="secondary-button" href="/admin/updates">一覧に戻る</a>
          <div class="update-submit-actions">
            <button class="secondary-button" type="submit" name="status" value="draft">下書き保存</button>
            <button class="secondary-button" type="submit" name="status" value="scheduled">予約する</button>
            <button class="primary-button" type="submit" name="status" value="published">公開する</button>
          </div>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
